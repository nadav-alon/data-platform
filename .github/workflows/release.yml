# Tags a release when a push to main carries a package.json version with no
# release tag yet (scripts/release). Typecheck and tests gate the tag: CI runs
# on the same push but in parallel, so this job re-runs both itself rather than
# trusting CI's result to have landed first. The tag points at a commit made
# just for it — dist/ built and force-added despite .gitignore — so
# `npm install github:nadav-alon/data-platform#v<version>` gets built JS and
# type declarations with no build step of its own. Only the tag is pushed,
# never main itself: main's own history stays free of dist/ (RELEASING.md).
# Once the tag is pushed, a GitHub Release is created for it with
# auto-generated notes.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags: scripts/release/pending-tag.ts checks
          # every past release tag, not just what a shallow clone would see.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Determine the pending release tag
        id: pending
        run: |
          tag="$(node scripts/release/pending-tag.ts)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: steps.pending.outputs.tag != ''
        run: npm ci
      - name: Typecheck
        if: steps.pending.outputs.tag != ''
        run: npm run typecheck
      - name: Test
        if: steps.pending.outputs.tag != ''
        run: npm test
      - name: Build dist/ and push the release tag
        if: steps.pending.outputs.tag != ''
        env:
          TAG: ${{ steps.pending.outputs.tag }}
        run: |
          npm run build
          git add -f dist
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Release $TAG"
          git tag "$TAG"
          git push origin "$TAG"
      - name: Create the GitHub Release
        # Computes TAG itself rather than reading steps.pending.outputs.tag,
        # which is empty once the tag exists — including right after this
        # step's own past failure. Runs unconditionally so a Release missed
        # by an earlier run still gets created on the next push to main. Only
        # ever acts on a tag already pushed to origin: `gh release create`
        # would otherwise tag main's current HEAD itself, which may not be
        # the commit this version was meant to release from (e.g. a push
        # whose typecheck or test step failed before the tag was pushed).
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(node scripts/release/current-tag.ts)"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          fi
