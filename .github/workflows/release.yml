# Tags a release when a push to main is the commit that changed package.json's
# version and no release tag exists for it yet (scripts/release). A push that
# finds the tag missing without having changed the version itself fails the
# job instead, rather than releasing its own unrelated tree under that tag
# (RELEASING.md). Typecheck, tests and the rules harness gate the tag: CI runs
# the same checks on the same push but in parallel, so this job re-runs them
# all itself rather than trusting CI's result to have landed first. The tag
# points at a commit made just for it — dist/ built and force-added despite
# .gitignore — so `npm install github:nadav-alon/data-platform#v<version>`
# gets built JS and type declarations with no build step of its own. Only the
# tag is pushed, never main itself: main's own history stays free of dist/
# (RELEASING.md).
# Once the tag is pushed, a GitHub Release is created for it with
# auto-generated notes.
# When the repo variable FIREBASE_PROJECT_ID is set, the tag's tree is then deployed to that
# project the same way `npm run deploy -- --project <id>` does from a clone, authenticated with
# the FIREBASE_SERVICE_ACCOUNT secret like deploy.yml (docs/household-setup.md). Left unset — a
# fork, another household — the release behaves exactly as before this step existed. Deploying
# follows the same always-run, recompute-the-tag pattern as the Release creation step below, so a
# deploy that failed (or a run that failed before reaching it) is retried by the next push without
# re-tagging: RELEASING.md's recovery story covers releasing, not deploying, so this can't wait for
# the push that changed `version` specifically, only for the tag to exist.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags: scripts/release/pending-tag.ts checks
          # every past release tag, not just what a shallow clone would see.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Determine the pending release tag
        id: pending
        env:
          # The commit `main` pointed at before this push, so the version
          # comparison is per-push rather than per-commit.
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          tag="$(node scripts/release/pending-tag.ts)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Determine whether this release should deploy
        # Mirrors "Create the GitHub Release" below: recomputes the current tag rather than
        # trusting steps.pending, and only acts once that tag is pushed to origin, so a deploy
        # skipped by an earlier failed run still happens on the next push.
        id: deploy-target
        if: always() && !cancelled()
        env:
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$PROJECT_ID" ]; then
            exit 0
          fi
          tag="$(node scripts/release/current-tag.ts)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "project-id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: always() && !cancelled() && (steps.pending.outputs.tag != '' || steps.deploy-target.outputs.project-id != '')
        run: npm ci
      - name: Typecheck
        if: steps.pending.outputs.tag != ''
        run: npm run typecheck
      - name: Test
        if: steps.pending.outputs.tag != ''
        run: npm test
      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v4
        if: steps.pending.outputs.tag != ''
        with:
          distribution: temurin
          java-version: "21"
      - name: Rules test harness
        if: steps.pending.outputs.tag != ''
        run: npm run test:rules
      - name: Build dist/ and push the release tag
        if: steps.pending.outputs.tag != ''
        env:
          TAG: ${{ steps.pending.outputs.tag }}
        run: |
          npm run build
          git add -f dist
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Release $TAG"
          git tag "$TAG"
          git push origin "$TAG"
      - name: Create the GitHub Release
        # Computes TAG itself rather than reading steps.pending.outputs.tag,
        # which is empty once the tag exists — including right after this
        # step's own past failure. Runs unconditionally so a Release missed
        # by an earlier run still gets created on the next push to main. Only
        # ever acts on a tag already pushed to origin: `gh release create`
        # would otherwise tag main's current HEAD itself, which may not be
        # the commit this version was meant to release from (e.g. a push
        # whose typecheck or test step failed before the tag was pushed).
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(node scripts/release/current-tag.ts)"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          fi
      - name: Write the service account key
        if: always() && !cancelled() && steps.deploy-target.outputs.project-id != '' && env.FIREBASE_SERVICE_ACCOUNT != ''
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
      - name: Deploy the release
        if: always() && !cancelled() && steps.deploy-target.outputs.project-id != ''
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' && format('{0}/service-account.json', runner.temp) || '' }}
          PROJECT_ID: ${{ steps.deploy-target.outputs.project-id }}
        run: npm run deploy -- --project "$PROJECT_ID"
