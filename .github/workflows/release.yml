# Tags a release when a push to main is the commit that changed package.json's
# version and no release tag exists for it yet (scripts/release). A push that
# finds the tag missing without having changed the version itself fails the
# job instead, rather than releasing its own unrelated tree under that tag
# (RELEASING.md). Typecheck, tests and the rules harness gate the tag: CI runs
# the same checks on the same push but in parallel, so this job re-runs them
# all itself rather than trusting CI's result to have landed first. The tag
# points at a commit made just for it — dist/ built and force-added despite
# .gitignore — so `npm install github:nadav-alon/data-platform#v<version>`
# gets built JS and type declarations with no build step of its own. Only the
# tag is pushed, never main itself: main's own history stays free of dist/
# (RELEASING.md).
# Once the tag is pushed, a GitHub Release is created for it with
# auto-generated notes.
# When the repo variable FIREBASE_PROJECT_ID is set, the push that tagged this release — or a
# re-run of it — also deploys that tag to that project the same way `npm run deploy -- --project
# <id>` does, from a checkout of the tag itself rather than this job's own, authenticated with the
# FIREBASE_SERVICE_ACCOUNT secret like deploy.yml (docs/household-setup.md). Left unset, no deploy
# runs. A deploy that fails fails the job without un-releasing the tag; re-running it deploys the
# same tag again without re-tagging. A later push that tags nothing new deploys nothing either.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags: scripts/release/pending-tag.ts checks
          # every past release tag, not just what a shallow clone would see.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Determine the pending release tag
        id: pending
        env:
          # The commit `main` pointed at before this push, so the version
          # comparison is per-push rather than per-commit.
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          tag="$(node scripts/release/pending-tag.ts)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: steps.pending.outputs.tag != ''
        run: npm ci
      - name: Typecheck
        if: steps.pending.outputs.tag != ''
        run: npm run typecheck
      - name: Test
        if: steps.pending.outputs.tag != ''
        run: npm test
      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v4
        if: steps.pending.outputs.tag != ''
        with:
          distribution: temurin
          java-version: "21"
      - name: Rules test harness
        if: steps.pending.outputs.tag != ''
        run: npm run test:rules
      - name: Build dist/ and push the release tag
        if: steps.pending.outputs.tag != ''
        env:
          TAG: ${{ steps.pending.outputs.tag }}
        run: |
          npm run build
          git add -f dist
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Release $TAG"
          git tag "$TAG"
          git push origin "$TAG"
      - name: Determine the current release tag
        # Recomputes from package.json rather than trusting steps.pending, which is empty once the
        # tag exists — including right after this step's own past failure — and only acts once
        # that tag is pushed to origin, so a run whose typecheck or test step failed before the tag
        # push doesn't treat its own checkout as released. Create the GitHub Release and Deploy the
        # release both key off this instead of each repeating the same check.
        id: current-tag
        if: always() && !cancelled()
        run: |
          tag="$(node scripts/release/current-tag.ts)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi
      - name: Create the GitHub Release
        # Runs whenever the current tag is pushed, tagged by this run or an earlier one, so a
        # Release missed by a run that failed after tagging still gets created on the next push.
        if: always() && !cancelled() && steps.current-tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.current-tag.outputs.tag }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
      - name: Determine whether this release should deploy
        # Deploys the push that tagged this release, or a re-run recovering from a deploy that
        # failed (or a run that failed before reaching it) — never a later push that tags nothing
        # new, which would otherwise redeploy the same release on every push to main.
        id: deploy-target
        if: always() && !cancelled() && steps.current-tag.outputs.tag != '' && (steps.pending.outputs.tag != '' || github.run_attempt > 1)
        env:
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          if [ -n "$PROJECT_ID" ]; then
            echo "project-id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out the release tag
        # deploy.ts reads firestore.rules and PLATFORM_VERSION from the working directory, which
        # this job's own checkout matches only on a push that both tags and changes nothing
        # afterward — never true on a re-run. Deploy from the tag's own tree instead. The tag may
        # not be in this checkout's history (main never merges it), so fetch it by name first.
        if: always() && !cancelled() && steps.deploy-target.outputs.project-id != ''
        env:
          TAG: ${{ steps.current-tag.outputs.tag }}
        run: |
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          git worktree add "$RUNNER_TEMP/release" "$TAG"
          cd "$RUNNER_TEMP/release" && npm ci
      - name: Write the service account key
        if: always() && !cancelled() && steps.deploy-target.outputs.project-id != '' && env.FIREBASE_SERVICE_ACCOUNT != ''
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
      - name: Fail if FIREBASE_SERVICE_ACCOUNT is missing
        # Left to Deploy the release, a missing key reaches applicationDefault() with
        # GOOGLE_APPLICATION_CREDENTIALS='' and throws there, without ever naming the secret.
        if: always() && !cancelled() && steps.deploy-target.outputs.project-id != '' && env.FIREBASE_SERVICE_ACCOUNT == ''
        run: |
          echo "::error::FIREBASE_PROJECT_ID is set but the FIREBASE_SERVICE_ACCOUNT repo secret is not; deploy needs it to write meta/platform (docs/household-setup.md)." >&2
          exit 1
      - name: Deploy the release
        if: always() && !cancelled() && steps.deploy-target.outputs.project-id != '' && env.FIREBASE_SERVICE_ACCOUNT != ''
        working-directory: ${{ runner.temp }}/release
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ format('{0}/service-account.json', runner.temp) }}
          PROJECT_ID: ${{ steps.deploy-target.outputs.project-id }}
        run: npm run deploy -- --project "$PROJECT_ID"
